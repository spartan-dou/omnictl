name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      # CRT statique : les exécutables ne dépendent d'aucune DLL à installer.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust (x64 + ARM64)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: Tests
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Compilation x64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Compilation ARM64
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Rassembler les exécutables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/omnictl.exe dist/omnictl-x64.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/omnictl-gui.exe dist/omnictl-gui-x64.exe
          Copy-Item target/aarch64-pc-windows-msvc/release/omnictl.exe dist/omnictl-arm64.exe
          Copy-Item target/aarch64-pc-windows-msvc/release/omnictl-gui.exe dist/omnictl-gui-arm64.exe
          # Empreintes, pour vérifier un téléchargement.
          Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist | Select-Object Name, Length
          Get-Content dist/SHA256SUMS.txt

      # Installeur MSI (Program Files, pour tout le PC), compilé avec WiX Toolset.
      - name: Paquets MSI
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          dotnet tool install --global wix --version 5.0.2
          foreach ($arch in 'x64', 'arm64') {
            wix build packaging/omnictl.wxs -arch $arch -d Version=$version -d Arch=$arch -d Dist=dist -o dist/omnictl-$arch.msi
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # Version portable : un zip, rien à installer, réglages à côté de l'exécutable.
      - name: Versions portables
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            $dir = "portable-$arch"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item dist/omnictl-gui-$arch.exe $dir/omnictl-gui.exe
            Copy-Item dist/omnictl-$arch.exe $dir/omnictl.exe
            Copy-Item packaging/portable.txt $dir/
            Compress-Archive -Path "$dir/*" -DestinationPath dist/omnictl-portable-$arch.zip
          }
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: omnictl-windows
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

  # Chaque architecture Linux compile sur une machine de son architecture : rien à installer.
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Tests
        run: cargo test

      - name: Compilation
        run: cargo build --release --bin omnictl

      - name: Rassembler les fichiers
        run: |
          mkdir -p dist
          cp target/release/omnictl dist/omnictl-linux-${{ matrix.arch }}
          cp linux/60-omnictl.rules dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: omnictl-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Un tag « v… » publie une release avec les exécutables compilés ci-dessus.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Empreintes et numéro de version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          # Une seule liste d'empreintes pour tous les fichiers, et le numéro de version
          # que l'application consulte pour savoir si elle est à jour.
          rm -f SHA256SUMS.txt
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          echo "${TAG#v}" > VERSION
          cat SHA256SUMS.txt VERSION

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "omnictl $TAG" \
            --generate-notes \
            --verify-tag
