[package]
name = "omnictl"
version = "0.4.0"
edition = "2021"
description = "Contrôleur léger et libre pour les périphériques ASUS ROG (clavier Strix Scope II 96 Wireless, dongle Omni)"
license = "GPL-2.0-or-later"

# Aucune dépendance : bibliothèque standard + appels directs à l'API HID de Windows.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
